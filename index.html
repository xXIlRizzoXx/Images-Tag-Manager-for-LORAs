<!-- 
*******************************************************************************
*******************************************************************************
**                                                                           **
**  ITALIANO: PAGINA WEB DI BASE                                             **
**  Questo è il "contenitore" principale che ospita l'intera applicazione.   **
**  È la prima cosa che viene caricata dal browser.                          **
**                                                                           **
**  ENGLISH: BASE WEB PAGE                                                   **

**                                                                           **
*******************************************************************************

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ITALIANO: Content-Security-Policy di base, larga per Vite in sviluppo; nella build la stringe scripts/csp-produzione.mjs -->
    <!-- ENGLISH: Baseline Content-Security-Policy, loose for Vite in development; the build tightens it with scripts/csp-produzione.mjs -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://generativelanguage.googleapis.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Images Tag Manager for LORAs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
