<!--
*******************************************************************************
**                                                                            **
**  ITALIANO: SCHERMATA DI CARICAMENTO (SPLASH SCREEN)                        **
**  Questa pagina viene mostrata all'avvio del programma mentre               **
**  l'applicazione principale si carica in background.                        **
**                                                                            **
**  ENGLISH: LOADING SCREEN (SPLASH SCREEN)                                   **
**  This page is shown at startup while the main application                  **
**  loads in the background.                                                  **
**                                                                            **
*******************************************************************************
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            width: 580px;
            height: 380px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Effetto particelle/luce in background */
        .splash-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(99, 102, 241, 0.4));
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-align: center;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 8px 0 0 0;
            font-size: 14px;
            font-weight: 500;
            color: #818cf8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer {
            position: relative;
            z-index: 10;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }

        .loading-text {
            font-size: 12px;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(165, 180, 252, 0.3);
            border-top-color: #a5b4fc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .version-info {
            text-align: right;
        }

        .version {
            font-size: 14px;
            font-weight: 700;
            color: white;
            margin: 0 0 4px 0;
        }

        /* ITALIANO: versione sotto al sottotitolo, discreta ma leggibile */
        /* ENGLISH: version under the subtitle, discreet but legible */
        .version-main {
            margin: 14px 0 0 0;
            font-size: 12px;
            font-weight: 600;
            color: #a5b4fc;
            letter-spacing: 1px;
        }
        /* ITALIANO: il copyright e' un link al profilo GitHub: si comporta da link */
        /* ENGLISH: the copyright is a link to the GitHub profile: it behaves like one */
        .copyright {
            font-size: 10px;
            color: #6366f1;
            margin: 0;
            cursor: pointer;
            transition: color 0.2s ease;
            -webkit-user-select: none;
            user-select: none;
        }
        .copyright:hover {
            color: #c7d2fe;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="content">
            <div class="logo-box">
                <img src="../public/logo.png" alt="Logo" onerror="this.src='../public/icon.png'" />
            </div>
            <h1>Images Tag Manager</h1>
            <h2>For LORAs</h2>
            <!-- ITALIANO: versione sotto al sottotitolo, riempita da splash.js -->
            <!-- ENGLISH: version under the subtitle, filled in by splash.js -->
            <p class="version-main" id="version-main"></p>
        </div>
        <div class="footer">
            <div class="loading-text">
                <div class="spinner"></div>
                <span id="loading-msg">Inizializzazione ambiente...</span>
            </div>
            <div class="version-info">
                <!-- ITALIANO: la versione sta sotto al sottotitolo (piu' visibile); qui resta
                                solo il copyright, che apre il profilo GitHub. -->
                <!-- ENGLISH: the version sits under the subtitle (more visible); only the
                              copyright remains here, opening the GitHub profile. -->
                <p class="copyright" id="copyright-link" title="github.com/xXIlRizzoXx">© xXIlRizzoXx</p>
            </div>
        </div>
    </div>

    <!-- ITALIANO: script in un file a parte: quello scritto dentro la pagina veniva
                    rifiutato dalla regola di sicurezza nell'app compilata (vedi splash.js) -->
    <!-- ENGLISH: script in a separate file: an inline one was refused by the security rule
                  in the packaged app (see splash.js) -->
    <script src="./splash.js"></script>
</body>
</html>
