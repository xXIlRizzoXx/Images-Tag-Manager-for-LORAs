**  ITALIANO: SCHERMATA DI CARICAMENTO (SPLASH SCREEN)                        **
**  Questa pagina viene mostrata all'avvio del programma mentre               **
**  l'applicazione principale si carica in background.                        **
**                                                                            **
**  ENGLISH: LOADING SCREEN (SPLASH SCREEN)                                   **
**  This page is shown at startup while the main application                  **
**  loads in the background.                                                  **
**                                                                            **
*******************************************************************************
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            width: 580px;
            height: 380px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Effetto particelle/luce in background */
        .splash-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(99, 102, 241, 0.4));
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-align: center;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 8px 0 0 0;
            font-size: 14px;
            font-weight: 500;
            color: #818cf8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer {
            position: relative;
            z-index: 10;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }

        .loading-text {
            font-size: 12px;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(165, 180, 252, 0.3);
            border-top-color: #a5b4fc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .version-info {
            text-align: right;
        }

        .version {
            font-size: 14px;
            font-weight: 700;
            color: white;
            margin: 0 0 4px 0;
        }

        .copyright {
            font-size: 10px;
            color: #6366f1;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="content">
            <div class="logo-box">
                <img src="../public/logo.png" alt="Logo" onerror="this.src='../public/icon.png'" />
            </div>
            <h1>Images Tag Manager</h1>
            <h2>For LORAs</h2>
        </div>
        <div class="footer">
            <div class="loading-text">
                <div class="spinner"></div>
                <span id="loading-msg">Inizializzazione ambiente...</span>
            </div>
            <div class="version-info">
                <p class="version" id="version-text">v2.1.0</p>
                <p class="copyright">© xXIlRizzoXx</p>
            </div>
        </div>
    </div>

    <script>
        // Semplice animazione del testo di caricamento
        const messages = [
            "Inizializzazione ambiente...",
            "Caricamento moduli AI...",
            "Preparazione interfaccia...",
            "Avvio in corso..."
        ];
        let i = 0;
        const msgEl = document.getElementById('loading-msg');
        
        setInterval(() => {
            i = (i + 1) % messages.length;
            msgEl.style.opacity = 0;
            setTimeout(() => {
                msgEl.innerText = messages[i];
                msgEl.style.opacity = 1;
            }, 200);
        }, 800);

        // Cerca di leggere la versione dal package.json se possibile (in Electron nodeIntegration è true)
        try {
            const fs = require('fs');
            const path = require('path');
            const pkg = JSON.parse(fs.readFileSync(path.join(__dirname, '../package.json'), 'utf8'));
            document.getElementById('version-text').innerText = 'v' + pkg.version;
        } catch(e) {
            console.log("Using default version");
        }
    </script>
</body>
</html>
